<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Photo Gallery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Nature Photography Gallery</h1>
  </header>

  <main>
    <figure>
      <img src="images/Red.jpeg" alt="Vibrant red autumn leaf resting on a rock">
      <figcaption>
        <p>A crisp morning highlighting the deep red tones of autumn leaves.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="images/Orange.png" alt="Warm orange glow across a sunset horizon">
      <figcaption>
        <p>Golden evening light spreading warmth across the open horizon.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="images/Yellow.png" alt="Bright yellow sunflower blooming in the sun">
      <figcaption>
        <p>Sunlight bathing the bright yellow petals on an open summer field.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="images/Green.png" alt="Dense green pine trees in a mountain forest">
      <figcaption>
        <p>Tall evergreens standing quietly along the cool mountain slopes.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="images/Blue.png" alt="Calm deep blue ocean waves hitting the coastline">
      <figcaption>
        <p>Gentle deep blue ocean waves rolling steadily toward the quiet shore.</p>
      </figcaption>
    </figure>
  </main>

  <footer>
    <p>&copy; 2026 Nguyen Tan Tai. All rights reserved.</p>
  </footer>
</body>
</html>
